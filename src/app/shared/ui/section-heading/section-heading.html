

<div class="heading" [class.center]="align() === 'center'" [class.end]="align() === 'end'">
  <div class="section_heading">
    <p>{{ subtitle() }}</p>
    <h3>{{ title() }}</h3>
  </div>

  <div class="view_all_btn_area" *ngIf="viewAllLink()">
    <a class="view_all_btn" [href]="viewAllLink()">
      {{ viewAllText() }} <i class="bi bi-arrow-right" aria-hidden="true"></i>
    </a>
  </div>
</div>
